name: Deploy to GitHub Pages

# Publishes the built site to the gh-pages branch. On a public repo, creating
# that branch auto-enables Pages (source: branch), so no manual setup is needed —
# the Actions-native deploy path (actions/deploy-pages) requires a Pages site to
# already exist, which the workflow token is not allowed to create.

on:
  push:
    branches: [main, claude/understory-playtest-elc65b]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
